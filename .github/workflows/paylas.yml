name: Reels paylas

# GitHub'in zamanlayicisi saatlerce gecikebildigi icin calisma ~5,5 saat acik kalir,
# 15 dakikada bir kontrol eder (son paylasimdan ARALIK_DK gectiyse paylasir)
# ve bitince kendini yeniden baslatir. Zamanlayici sadece zincir koparsa yedek.
on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write

concurrency:
  group: paylas
  cancel-in-progress: false

jobs:
  paylas:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Stoktan paylas (dongu)
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_ID: ${{ secrets.IG_ID }}
          GH_TOKEN: ${{ github.token }}
        run: |
          bitis=$(( $(date +%s) + 330*60 ))
          while [ $(date +%s) -lt $bitis ]; do
            python bulut_paylas.py || echo "deneme basarisiz, devam"
            sleep 900
          done
      - name: Kendini yeniden baslat
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run paylas.yml -R ${{ github.repository }}
